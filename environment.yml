# Conda 环境配置（含 PyTorch+CUDA 依赖）
# 全云端策略：LLM/图像/视频全部走 API，本地仅常驻 NudeNet

name: ai_manga_agent
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  - pip
  # ML & GPU
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=12.1
  - onnxruntime-gpu
  # Core
  - pydantic>=2.0
  - pydantic-settings>=2.0
  - sqlalchemy>=2.0
  - asyncpg>=0.29
  - alembic>=1.13
  # Redis & MinIO
  - redis-py>=5.0
  - minio>=7.2
  # HTTP & API
  - fastapi>=0.115
  - uvicorn>=0.30
  - httpx>=0.27
  - websockets>=12.0
  # Task Queue
  - celery>=5.4
  - flower>=2.0
  # LangGraph & LangChain
  - langchain>=0.3
  - langgraph>=0.2
  # Observability
  - structlog>=24.0
  - opentelemetry-api>=1.27
  - opentelemetry-sdk>=1.27
  - opentelemetry-exporter-otlp>=1.27
  - opentelemetry-instrumentation-fastapi>=0.48
  - prometheus-client>=0.20
  # Image & Video
  - pillow>=10.0
  - opencv-python>=4.9
  - ffmpeg-python>=0.2
  # Utilities
  - python-dotenv>=1.0
  - pyyaml>=6.0
  - tenacity>=8.0
  - rich>=13.0
  # Testing
  - pytest>=8.0
  - pytest-asyncio>=0.24
  - pytest-cov>=5.0
  # NudeNet (本地 NSFW)
  - pip:
      - nudenet>=3.0
      - open_clip_torch>=2.26
