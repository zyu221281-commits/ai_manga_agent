name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check app

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python scripts/test_interrupt.py
        env:
          APP_ENV: test

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == "refs/heads/main"
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-manga-agent .
      - run: docker save ai-manga-agent | gzip > ai-manga-agent.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ai-manga-agent.tar.gz
