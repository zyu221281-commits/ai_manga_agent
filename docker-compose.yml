# Docker Compose 配置
# services: postgres + redis + minio + celery-worker + celery-beat + fastapi
#          + prometheus + grafana + jaeger

version: "3.8"

x-common-env: &common-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: root
  POSTGRES_PASSWORD: "123456"
  POSTGRES_DB: mydb
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_SECURE: "false"

services:
  postgres:
    image: postgres:16
    container_name: ama_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ama_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ama_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: ama_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/images;
      mc mb --ignore-existing local/videos;
      mc mb --ignore-existing local/assets;
      mc mb --ignore-existing local/backups;
      mc anonymous set download local/images;
      echo 'MinIO buckets created';
      exit 0;
      "

  # PG 建表服务：postgres healthy 后执行 init.sql（幂等，可重复执行）
  # 用独立 service 而非 FastAPI lifespan，避免 lifespan 阻塞启动或 PG 故障导致 FastAPI 启动失败
  pg-init:
    image: postgres:16
    container_name: ama_pg_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "123456"
    volumes:
      - ./app/db/init.sql:/init/init.sql:ro
    entrypoint: >
      /bin/sh -c "
      echo 'Running PG schema init...';
      psql -h postgres -U root -d mydb -f /init/init.sql;
      echo 'PG schema init done';
      exit 0;
      "
    restart: "no"

  fastapi:
    build: .
    container_name: ama_fastapi
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  celery-worker:
    build: .
    container_name: ama_celery_worker
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=3
    restart: unless-stopped

  celery-beat:
    build: .
    container_name: ama_celery_beat
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
    command: celery -A app.tasks.celery_app beat --loglevel=info
    restart: unless-stopped

  flower:
    image: mher/flower:latest
    container_name: ama_flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ama_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ama_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ama_jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
